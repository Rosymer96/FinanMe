<div class="component-container">
  <!-- Contenedor del gráfico y botón de agregar -->
  <div class="chart-container">
    <ngx-charts-pie-chart
      class="chart"
      [view]="view"
      [results]="chartData"
      [legend]="false"
      [labels]="true"
      [doughnut]="true"
      [explodeSlices]="false"
      [gradient]="true"
      [animations]="true"
    >
      >
    </ngx-charts-pie-chart>
    <div class="container-button">
      <!-- Botón flotante para añadir un nuevo gasto -->

      <button mat-fab class="add-button-expense" (click)="addExpense()">
        <mat-icon>add</mat-icon>
      </button>
    </div>
  </div>

  <!-- Tabla personalizada hecha con divs  -->

  <div class="table">
    <!-- Bucle que recorre cada categoría y muestra su información -->
    @for(data of chartData; track $index){
    <div class="row">
      <div class="column name">{{ data.name }}</div>
      <div class="column percentage">{{ data.percentage }} %</div>
      <div class="column value">€ {{ data.value }}</div>
    </div>
    }
  </div>
</div>
