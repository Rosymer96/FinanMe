<mat-toolbar class="toolbar">
  <!-- Botón del menú hamburguesa de móbiles -->
  <button
    mat-icon-button
    class="toolbar-icon"
    aria-label="Example icon-button with menu icon"
    (click)="toggleMenu()"
  >
    <mat-icon>menu</mat-icon>
  </button>
  <!-- Botón del logo  -->
  <button mat-button class="logo" (click)="goHome()">
    <img class="img-logo" src="/logo/logo-FinanMe.png" />
  </button>
  <!-- Espaciador para separar elementos -->
  <span class="example-spacer"></span>
  <!-- Menu en ordenador -->
  <div class="menu-desktop">
    <button class="menu-button" mat-button (click)="goHome()">Inicio</button>
    <button mat-button (click)="addExpense()">Añadir</button>
    <button mat-button (click)="filterExpenses()">Filtrar</button>
  </div>
  <!-- Menu desplegablepara en móbiles, se muestra si inMenuOpen es true. -->
  @if(isMenuOpen){
  <div class="menu-mobile">
    <button class="menu-button" mat-button (click)="goHome()">Inicio</button>
    <button mat-button (click)="addExpense()">Añadir</button>
    <button mat-button (click)="filterExpenses()">Filtrar</button>
  </div>
  }
  <!-- Icono de perfil -->
  <button mat-icon-button class="toolbar-icon-login">
    <mat-icon>account_circle</mat-icon>
  </button>
  <!-- Icono para cerrar sesión -->
  <button mat-icon-button class="toolbar-icon-logout">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>
